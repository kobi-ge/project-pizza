apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo-service
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: docker.io/library/mongo:7
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongovolume
          mountPath: /data/db
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: kodi
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: word

  volumeClaimTemplates:
  - metadata:
      name: mongovolume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

